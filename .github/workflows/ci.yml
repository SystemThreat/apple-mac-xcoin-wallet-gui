name: build and test (macOS)

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  mac:
    runs-on: macos-latest          # Apple Silicon runner, like the Macs the app is built for
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Python packages (the app's own libraries; pyscard is only needed with a real reader)
        run: python -m pip install --upgrade pip -r gui/requirements.txt
      - name: Build the keytool
        run: ./build.sh
      - name: Golden vectors
        run: ./xcoin-wallet _v3vectors
      - name: Tests
        run: python -m unittest discover -s tests -v

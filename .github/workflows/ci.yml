# Build the keytool and run every test on Linux and Windows on each push. macOS runs on request (it costs ten
# times the minutes, and every change is tested on a Mac before it is pushed).
name: build and test
on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      macos:
        description: "Also run on macOS"
        type: boolean
        default: false

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Python packages (card crypto; pyscard is only needed with a real reader)
        run: python -m pip install --upgrade pip cryptography
      - name: Build the keytool
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
          cmake --build build --config Release
      - name: Golden vectors
        run: ctest --test-dir build -C Release --output-on-failure
      - name: Put the keytool next to wallet_cli.py
        shell: bash
        run: |
          if [ -f build/Release/xcoin-wallet.exe ]; then cp build/Release/xcoin-wallet.exe .; else cp build/xcoin-wallet .; fi
          ls -la xcoin-wallet*
      - name: Tests
        run: python -m unittest discover -s tests -v
      - name: Keytool artifact
        uses: actions/upload-artifact@v4
        with:
          name: keytool-${{ matrix.os }}
          path: |
            xcoin-wallet
            xcoin-wallet.exe
          if-no-files-found: ignore

  macos:
    if: github.event_name == 'workflow_dispatch' && inputs.macos
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install cryptography
      - run: ./build.sh
      - run: python -m unittest discover -s tests -v
